<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cotizador | Dolce Gusto</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>

<body>

    <div class="contenedor">

        <h2>Cotiza tu Evento 🌽</h2>

        <p class="subtitulo">
            Selecciona las opciones para tu presupuesto
        </p>

        <!-- PERSONAS -->
        <label>1. ¿Cuántas personas son?</label>

        <select id="cantidadPersonas"
            onchange="actualizarPaquetes()">

            <option value="0" disabled selected>
                Selecciona cantidad...
            </option>

        </select>

        <!-- PAQUETES -->
        <label>2. Selecciona tu Paquete:</label>

        <select id="paquete"
            onchange="calcularTotal()">

            <option value="0" disabled selected>
                Primero elige el número de personas...
            </option>

        </select>

        <!-- UBICACIÓN -->
        <label>
            3. Busca o toca la ubicación del evento:
        </label>

        <p class="texto-ayuda">
            Puedes escribir una colonia,
            salón, calle o tocar el mapa 📍
        </p>

        <!-- BUSCADOR -->
        <input type="text"
            id="buscadorDireccion"
            placeholder="🔎 Busca la dirección del evento..."
            autocomplete="off">

        <div id="resultadosBusqueda"></div>

        <!-- DIRECCIÓN -->
        <div id="direccionSeleccionada">
            📍 Ninguna ubicación seleccionada
        </div>

        <!-- MAPA -->
        <div id="mapa"></div>

        <!-- DISTANCIA -->
        <div id="infoDistancia">
            Distancia calculada: 0 km
        </div>

        <!-- TOTAL -->
        <div class="total-box">

            <h3 id="resultadoTotal">
                Total: $0
            </h3>

        </div>

        <!-- BOTÓN -->
        <button onclick="enviarWhatsApp()">
            Enviar Cotización por WhatsApp 📲
        </button>

    </div>

    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>

</html>
